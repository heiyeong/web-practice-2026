<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">

    <title>영스페이지</title>
    <meta
        name="description"
        content="궁금한 점이나 문의사항을 남겨주세요"
    >

    <meta property:"og:title" content="문의하기">
    <meta
        property="og:description"
        content="궁금한 점이나 문의사항을 남겨주세요"
    >
    <meta
        property="og:url"
        content="https://example.com"
    >
</head>
<body>
    <header>
        <h1>문의하기</h1>
        <h2>박혜영</h2>
    </header>
    <main>
        <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNjA0MTJfODkg%2FMDAxNzc1OTczMDA0NzYw.9LgOQO2S5GwpLZKgV09VZYNDxBtvpWVSFqtuRFvUzOQg.291b2VqUBGPtJ65F-tr-p9Op-CEM8BwdjER4nkjscQIg.PNG%2F%257B3C78288B-A36A-4E86-AAEE-E4D161AF0582%257D.png&type=sc960_832" alt="문의하기 이미지"/>
        <br><br>
        <section>
            <fieldset>
            <h2>문의 사항을 남겨주세요</h2>
                <form>
                    <div>
                        <label for="name">이름</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                        >
                        <label for="email">이메일</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                        <label for="category">문의 유형</label>
                        <select id="category">
                            <option value="a" selected>주문</option>
                            <option value="b">배송</option>
                        </select>
                        <br><br>
                        <label for="message">문의 내용</label>
                        <br>
                        <textarea
                            id="message"
                            name="message"
                        ></textarea>
                    </div>
                    <br>

                    <button type="submit">
                        보내기
                    </button>
                </form>
            </fieldset>
        </section>
    </main>
    <footer>
        <p>이메일: <a href="qqqq@naver.com">qqqq@naver.com</a></p>
        <p>@2026 박혜영.</p>
    </footer>
</body>
</html>
